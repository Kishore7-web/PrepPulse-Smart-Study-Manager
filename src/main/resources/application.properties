spring.application.name=PrepPulse
server.port=8080
spring.datasource.url=jdbc:h2:file:./data/preppulse;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.thymeleaf.cache=false
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Kolkata
logging.level.com.preppulse=INFO

# Email is OFF by default. Configure environment variables to enable SMTP reminders.
preppulse.email.enabled=${PREPPULSE_EMAIL_ENABLED:false}
preppulse.email.host=${PREPPULSE_EMAIL_HOST:localhost}
preppulse.email.port=${PREPPULSE_EMAIL_PORT:587}
preppulse.email.username=${PREPPULSE_EMAIL_USERNAME:}
preppulse.email.password=${PREPPULSE_EMAIL_PASSWORD:}
preppulse.email.from=${PREPPULSE_EMAIL_FROM:}
preppulse.email.properties.mail.smtp.auth=true
preppulse.email.properties.mail.smtp.starttls.enable=true
